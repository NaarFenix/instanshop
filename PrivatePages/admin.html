<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: #fafafa; margin: 0; padding: 40px; color: #111; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .stat-card h3 { margin: 0; color: #888; font-size: 14px; font-weight: normal; }
        .stat-card p { margin: 10px 0 0 0; font-size: 28px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid #eaeaea; }
        th { background: #f5f5f5; font-weight: 600; font-size: 14px; }
        td { font-size: 15px; }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .toggle { display: flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; }
        button { padding: 8px 16px; background: #111; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        .btn-outline { background: transparent; color: #111; border: 1px solid #ccc; }
        .restock-form { display: flex; gap: 10px; }
        .restock-form input { padding: 8px; border: 1px solid #ccc; border-radius: 6px; width: 80px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Yan Sen Dashboard</h1>
            <a href="/api/logout" style="color: #ff3b30; text-decoration: none; font-weight: bold;">Logout</a>
        </div>

        <!-- Stats -->
        <div class="stats" id="stats" hx-get="/api/admin/stats" hx-trigger="load, every 10s, refreshStats from:body">
        </div>

        <!-- Controls -->
        <div class="controls">
            <label class="toggle">
                <!-- Fixed checkbox to send 'true' and listen for refreshTable -->
                <input type="checkbox" name="hidePackaged" value="true" checked
                       hx-get="/api/admin/orders" 
                       hx-target="#orders-table" 
                       hx-include="this"
                       hx-trigger="change, load, refreshTable from:body">
                Hide Packaged Orders
            </label>
            
            <form class="restock-form" hx-post="/api/admin/restock" hx-trigger="submit">
                <input type="number" name="amount" value="10" min="1" required>
                <button type="submit" class="btn-outline">Restock Item</button>
            </form>
        </div>

        <!-- Orders Table -->
        <table>
            <thead>
                <tr>
                    <th>Order Info</th>
                    <th>Customer</th>
                    <th>Address</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="orders-table">
                <!-- Loaded via HTMX -->
            </tbody>
        </table>
    </div>

    <!-- Script to parse the JSON stats -->
    <script>
        document.body.addEventListener('htmx:afterOnLoad', function(evt) {
            if (evt.detail.pathInfo.requestPath === '/api/admin/stats') {
                try {
                    const data = JSON.parse(evt.detail.xhr.responseText);
                    evt.detail.elt.innerHTML = `
                        <div class="stat-card"><h3>Total Orders</h3><p>${data.orders}</p></div>
                        <div class="stat-card"><h3>Waiting</h3><p style="color:#ff9500;">${data.waiting}</p></div>
                        <div class="stat-card"><h3>Packaged</h3><p style="color:#34c759;">${data.packaged}</p></div>
                        <div class="stat-card"><h3>Revenue</h3><p>${data.revenue} MAD</p></div>
                    `;
                } catch(e) {}
            }
        });
    </script>
</body>
</html>
